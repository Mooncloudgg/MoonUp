<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moonup</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-container">

      <!-- ═══ TOP GROUP ═══ -->
      <div class="top-group">

        <!-- Header -->
        <header class="app-header">
          <div class="branding">
            <img src="/src/assets/Moonup_logo.png" class="app-logo" alt="" onerror="this.style.display='none'">
            <span class="app-title">Moonup</span>
            <span class="app-version-badge">v2.0</span>
          </div>
          <div class="header-actions">
            <button id="refresh-btn" class="icon-btn" title="Prüfen">🔄</button>
            <button id="open-settings-btn" class="icon-btn" title="Einstellungen">⚙️</button>
          </div>
        </header>

        <!-- Auth -->
        <div id="auth-section" class="auth-card">
          <div id="login-view">
            <button id="login-btn" class="login-btn-discord">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
              <span>Login mit Discord</span>
            </button>
            <div id="login-status" style="font-size:0.72rem; color:var(--text-muted); text-align:center; margin-top:5px; display:none;"></div>
          </div>
          <div id="user-view" class="user-bar" style="display:none;">
            <div class="user-info">
              <div id="user-avatar" class="user-avatar">M</div>
              <div>
                <span id="username-label" class="user-name">Mitglied</span>
                <span class="user-status-dot"></span>
              </div>
            </div>
            <button id="logout-btn" class="btn-logout">Abmelden</button>
          </div>
        </div>

        <!-- Status -->
        <div id="readiness-card" class="readiness-banner noauth">
          <div class="readiness-dot"></div>
          <div class="readiness-text">
            <span id="readiness-title" class="readiness-title">Login erforderlich</span>
            <span id="readiness-desc" class="readiness-desc">Bitte anmelden</span>
          </div>
        </div>

        <!-- Path -->
        <div class="path-card">
          <div class="path-row">
            <div id="path-display" class="path-box" title="Klicken zum Auswählen">WoW-Pfad auswählen...</div>
            <button id="change-path-btn" class="btn-path">Ändern</button>
            <button id="open-explorer-btn" class="btn-path" title="In Explorer öffnen">📂</button>
          </div>
        </div>
      </div>

      <!-- ═══ MAIN GROUP ═══ -->
      <div class="main-group">
        <div class="section-header">
          <span class="section-label">Addons</span>
          <span class="section-count">4 Addons</span>
        </div>
        <div id="addon-list" class="addon-list">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- ═══ BOTTOM GROUP ═══ -->
      <div class="bottom-group">
        <button id="update-all-btn" class="btn-update-all" disabled>
          <span>Alle aktualisieren</span>
        </button>
        <div id="status-text" class="status-footer">Bereit.</div>
      </div>

    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Einstellungen</h2>
          <span id="close-settings-btn" class="modal-close">&times;</span>
        </div>
        <div class="setting-row">
          <span>Mit Windows starten</span>
          <input type="checkbox" id="autostart-cb">
        </div>
        <div class="setting-row">
          <span>Version</span>
          <span style="font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--text-muted);">v2.0.0</span>
        </div>
        <div class="danger-zone">
          <button id="delete-all-addons-btn" class="btn-danger-outline">Alle Addons entfernen</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
